services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arena-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/negotiation_arena
      - REDIS_URL=
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - arena-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: arena-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - arena-network

  db:
    image: postgres:16-alpine
    container_name: arena-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=negotiation_arena
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - arena-network

volumes:
  postgres_data:

networks:
  arena-network:
    driver: bridge